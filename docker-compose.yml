services:
    postgres:
        image: postgres:17
        container_name: db
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d courses" ]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: always
        networks:
            - app-network

    rabbitmq:
        image: rabbitmq:3.13-management
        container_name: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        restart: always
        networks:
            - app-network

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        restart: always
        networks:
            - app-network

    api:
        build: .
        container_name: api
        ports:
            - "8080:8080"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
            - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
            - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
            - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
            - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
            - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
            - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
            - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
            - OTEL_SERVICE_NAME=${SPRING_APPLICATION_NAME}
            - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER}
            - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER}
            - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER}
            - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
            - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL}
            - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL}
            - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=${OTEL_INSTRUMENTATION_MICROMETER_ENABLED}
            - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_started
            redis:
                condition: service_started
            otel-collector:
                condition: service_started
        networks:
            - app-network

    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        container_name: otel-collector
        command: [ "--config=/etc/otel-collector-config.yml" ]
        volumes:
            - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml
        ports:
            - "4317:4317"
            - "4318:4318"
            - "8889:8889"
        networks:
            - app-network

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'
        ports:
            - "9090:9090"
        depends_on:
            - otel-collector
        networks:
            - app-network

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: "false"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./observability/grafana-provisioning:/etc/grafana/provisioning
        depends_on:
            - prometheus
        networks:
            - app-network

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
    prometheus_data:
    grafana_data:

networks:
    app-network:
        driver: bridge
