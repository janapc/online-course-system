services:
    postgres:
        image: postgres:17
        container_name: online-course-system-db
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d courses" ]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: always
        networks:
            - app-network

    rabbitmq:
        image: rabbitmq:3.13-management
        container_name: online-course-system-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        restart: always
        networks:
            - app-network

    redis:
        image: redis:7-alpine
        container_name: online-course-system-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        restart: always
        networks:
            - app-network

    api:
        build: .
        container_name: online-course-system-api
        ports:
            - "8080:8080"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
            - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
            - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
            - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
            - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
            - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
            - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
            - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_started
            redis:
                condition: service_started
        networks:
            - app-network

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:

networks:
    app-network:
        driver: bridge
